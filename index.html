
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:title" content="Special Invitation ❤️">
  <meta property="og:description" content="A special invitation just for you">
  <meta property="og:type" content="website">

  <title>Special Invitation ❤️</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
  >

  <style>
    :root {
      --ivory: #fff9f7;
      --white: #ffffff;
      --pink: #f3d6da;
      --pink-light: #fdebed;
      --rose: #d88c9a;
      --rose-dark: #b85f70;
      --burgundy: #6d2638;
      --gold: #d4af6a;
      --text: #56343d;
      --text-light: #80616a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      font-family: "Poppins", Arial, sans-serif;
      color: var(--text);

      background:
        radial-gradient(circle at 10% 10%, rgba(255,255,255,.9), transparent 30%),
        radial-gradient(circle at 90% 85%, rgba(216,140,154,.28), transparent 30%),
        linear-gradient(135deg, #fff9f7, #f8e2e5, #efd0d6);
    }

    /* Background glow */
    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      top: -140px;
      left: -100px;
      background: rgba(216,140,154,.28);
      animation: glow 8s ease-in-out infinite alternate;
    }

    body::after {
      right: -120px;
      bottom: -130px;
      background: rgba(212,175,106,.18);
      animation: glow 10s ease-in-out infinite alternate-reverse;
    }

    @keyframes glow {
      from {
        transform: translate(0) scale(1);
      }
      to {
        transform: translate(35px, 30px) scale(1.15);
      }
    }

    /* Floating hearts */
    .hearts::before,
    .hearts::after {
      content: "♡  ♡  ♡  ♡  ♡";
      position: fixed;
      bottom: -70px;
      white-space: nowrap;
      font-size: 42px;
      color: var(--rose-dark);
      opacity: .22;
      pointer-events: none;
      z-index: 0;
      animation: floatingHearts 13s linear infinite;
    }

    .hearts::before {
      left: 4%;
    }

    .hearts::after {
      right: 3%;
      animation-delay: 6s;
      font-size: 34px;
    }

    @keyframes floatingHearts {
      0% {
        transform: translateY(0) rotate(0);
        opacity: 0;
      }
      15% {
        opacity: .3;
      }
      80% {
        opacity: .22;
      }
      100% {
        transform: translateY(-120vh) rotate(15deg);
        opacity: 0;
      }
    }

    /* Main */
    .container {
      width: 100%;
      max-width: 520px;
      position: relative;
      z-index: 2;
    }

    .card {
      width: 100%;
      padding: 42px 34px;
      position: relative;
      overflow: hidden;
      text-align: center;

      background: rgba(255,255,255,.84);
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 32px;
      backdrop-filter: blur(22px);

      box-shadow:
        0 30px 80px rgba(109,38,56,.16),
        inset 0 1px 0 rgba(255,255,255,.9);

      animation: cardIn .9s cubic-bezier(.22,1,.36,1);
    }

    .card::before {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      top: -130px;
      right: -90px;
      border-radius: 50%;
      background: rgba(216,140,154,.18);
      filter: blur(5px);
      pointer-events: none;
    }

    .card::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      bottom: -120px;
      left: -80px;
      border-radius: 50%;
      background: rgba(212,175,106,.12);
      pointer-events: none;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(40px) scale(.94);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .step {
      position: relative;
      z-index: 2;
      animation: stepIn .55s cubic-bezier(.22,1,.36,1);
    }

    .hidden {
      display: none;
    }

    @keyframes stepIn {
      from {
        opacity: 0;
        transform: translateX(25px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* Typography */
    h1,
    h2 {
      font-family: "DM Serif Display", Georgia, serif;
      color: var(--burgundy);
    }

    h1 {
      margin: 14px 0;
      font-size: clamp(28px, 5vw, 35px);
      line-height: 1.25;
    }

    h2 {
      margin-bottom: 24px;
      font-size: 28px;
    }

    p {
      color: var(--text-light);
      line-height: 1.8;
      margin-bottom: 24px;
      font-size: 15px;
    }

    .emoji {
      display: inline-block;
      font-size: 62px;
      animation: heartbeat 2s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.12);
      }
    }

    /* Buttons */
    button {
      border: none;
      font-family: "Poppins", sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition:
        transform .3s ease,
        box-shadow .3s ease;
    }

    button:hover {
      transform: translateY(-4px);
    }

    button:active {
      transform: scale(.96);
    }

    .buttons {
      min-height: 75px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }

    .yes-btn,
    .no-btn {
      min-width: 125px;
      padding: 14px 25px;
      border-radius: 100px;
    }

    .yes-btn {
      position: relative;
      overflow: hidden;
      color: white;
      background: linear-gradient(135deg, var(--burgundy), var(--rose-dark));
      box-shadow: 0 12px 28px rgba(109,38,56,.25);
    }

    .yes-btn:hover {
      box-shadow: 0 18px 38px rgba(109,38,56,.34);
    }

    .no-btn {
      background: var(--pink);
      color: var(--burgundy);
      box-shadow: 0 8px 22px rgba(109,38,56,.09);
    }

    .next-btn,
    .send-btn {
      width: 100%;
      padding: 15px 20px;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      color: white;
      background: linear-gradient(135deg, var(--burgundy), var(--rose-dark));
      box-shadow: 0 12px 28px rgba(109,38,56,.22);
    }

    .next-btn:hover,
    .send-btn:hover {
      box-shadow: 0 18px 38px rgba(109,38,56,.3);
    }

    .next-btn::before,
    .send-btn::before,
    .yes-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 80%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.4),
        transparent
      );
      transform: skewX(-20deg);
      transition: .7s;
    }

    .next-btn:hover::before,
    .send-btn:hover::before,
    .yes-btn:hover::before {
      left: 130%;
    }

    /* Inputs */
    #dateInput,
    #timeInput {
      width: 100%;
      height: 58px;
      margin-bottom: 15px;
      padding: 0 18px;
      outline: none;

      border: 1px solid rgba(109,38,56,.08);
      border-radius: 17px;

      background: rgba(255,255,255,.88);
      color: var(--text);

      font-family: "Poppins", sans-serif;
      font-size: 15px;

      box-shadow: 0 8px 22px rgba(109,38,56,.07);

      transition: .3s ease;
    }

    #dateInput:focus,
    #timeInput:focus {
      border-color: var(--rose);
      box-shadow:
        0 0 0 4px rgba(216,140,154,.13),
        0 10px 25px rgba(109,38,56,.1);
      transform: translateY(-2px);
    }

    #dateInput::placeholder,
    #timeInput::placeholder {
      color: #9a727b;
    }

    /* Food / Place */
    .food-container,
    .place-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 24px;
    }

    .food-card,
    .place-card {
      min-height: 145px;
      padding: 12px;
      position: relative;
      overflow: hidden;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      cursor: pointer;

      background: rgba(255,255,255,.9);
      border: 2px solid transparent;
      border-radius: 22px;

      color: var(--text);

      box-shadow: 0 10px 25px rgba(109,38,56,.08);

      transition:
        transform .35s cubic-bezier(.22,1,.36,1),
        box-shadow .35s ease,
        border .3s ease;
    }

    .food-card::before,
    .place-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        circle at 50% 0%,
        rgba(216,140,154,.2),
        transparent 65%
      );
      opacity: 0;
      transition: .35s;
    }

    .food-card:hover,
    .place-card:hover {
      transform: translateY(-8px) scale(1.025);
      border-color: rgba(216,140,154,.5);
      box-shadow: 0 20px 38px rgba(109,38,56,.14);
    }

    .food-card:hover::before,
    .place-card:hover::before {
      opacity: 1;
    }

    .food-card img {
      width: 100%;
      height: 85px;
      object-fit: cover;
      border-radius: 15px;
      transition: transform .45s ease;
    }

    .food-card:hover img {
      transform: scale(1.07);
    }

    .food-card h3,
    .place-card h3 {
      margin-top: 9px;
      font-size: 15px;
      position: relative;
      z-index: 2;
    }

    .place-card {
      font-size: 38px;
    }

    .place-card h3 {
      font-size: 14px;
    }

    /* Selected */
    .food-card.active,
    .place-card.active {
      transform: translateY(-5px) scale(1.03);
      border-color: var(--rose-dark);

      background: linear-gradient(
        145deg,
        #ffffff,
        var(--pink-light)
      );

      box-shadow: 0 18px 38px rgba(216,140,154,.22);
    }

    .food-card.active::after,
    .place-card.active::after {
      content: "✓";
      position: absolute;
      top: 9px;
      right: 9px;

      width: 25px;
      height: 25px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      color: white;
      background: var(--rose-dark);

      font-size: 13px;

      animation: checkPop .3s ease;
    }

    @keyframes checkPop {
      from {
        transform: scale(0);
      }
      to {
        transform: scale(1);
      }
    }

    /* Cry */
    .cry {
      margin-top: 8px;
      animation: cryIn .5s ease;
    }

    .cry p {
      margin: 5px 0 0;
      color: var(--rose-dark);
    }

    @keyframes cryIn {
      from {
        opacity: 0;
        transform: scale(.7);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Final */
    .success {
      animation: finalIn .8s cubic-bezier(.22,1,.36,1);
    }

    #resultText {
      padding: 22px 18px;
      border-radius: 22px;

      background: linear-gradient(
        145deg,
        #ffffff,
        #fff3f5
      );

      border: 1px solid rgba(216,140,154,.15);

      color: var(--text);

      line-height: 1.7;

      box-shadow: 0 10px 25px rgba(109,38,56,.07);
    }

    @keyframes finalIn {
      0% {
        opacity: 0;
        transform: scale(.75) translateY(20px);
      }
      60% {
        transform: scale(1.05);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Flatpickr */
    .flatpickr-calendar {
      background: var(--ivory) !important;
      border: none !important;
      border-radius: 20px !important;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(109,38,56,.18) !important;
    }

    .flatpickr-months {
      background: var(--burgundy);
      padding: 8px;
    }

    .flatpickr-current-month,
    .flatpickr-current-month input.cur-year {
      color: white !important;
    }

    .flatpickr-weekdays {
      background: var(--pink) !important;
    }

    .flatpickr-weekday {
      color: var(--burgundy) !important;
    }

    .flatpickr-day {
      color: var(--burgundy) !important;
      border-radius: 50% !important;
    }

    .flatpickr-day:hover {
      background: var(--pink) !important;
      border-color: transparent !important;
    }

    .flatpickr-day.selected {
      background: var(--rose-dark) !important;
      border-color: var(--rose-dark) !important;
      color: white !important;
    }

    .flatpickr-time {
      background: var(--ivory) !important;
    }

    .flatpickr-time input {
      color: var(--burgundy) !important;
      background: white !important;
      font-weight: 600;
    }

    /* Mobile */
    @media (max-width: 600px) {
      body {
        align-items: flex-start;
        padding: 25px 12px 35px;
      }

      .card {
        padding: 30px 18px;
        border-radius: 27px;
      }

      .emoji {
        font-size: 54px;
      }

      h1 {
        font-size: 27px;
      }

      h2 {
        font-size: 24px;
      }

      p {
        font-size: 14px;
      }

      .buttons {
        gap: 10px;
      }

      .yes-btn,
      .no-btn {
        min-width: 110px;
        padding: 13px 18px;
      }

      .food-container,
      .place-container {
        gap: 10px;
      }

      .food-card,
      .place-card {
        min-height: 125px;
        border-radius: 18px;
      }

      .food-card img {
        height: 68px;
        border-radius: 12px;
      }

      .place-card {
        font-size: 32px;
      }

      .food-card h3,
      .place-card h3 {
        font-size: 13px;
      }

      #dateInput,
      #timeInput {
        height: 54px;
      }
    }

    @media (max-width: 360px) {
      .card {
        padding: 25px 14px;
      }

      h1 {
        font-size: 23px;
      }

      .yes-btn,
      .no-btn {
        min-width: 100px;
        padding: 11px 14px;
        font-size: 13px;
      }

      .food-card,
      .place-card {
        min-height: 115px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <div class="hearts"></div>

  <main class="container">

    <section class="card">

      <!-- STEP 1 -->
      <div class="step active" id="step1">

        <div class="emoji">❤️</div>

        <h1>
          Would you like to go out with me?
        </h1>

        <p>
          I have a special plan for you 😊
        </p>

        <div class="buttons">

          <button class="yes-btn" id="yesBtn">
            Yes ❤️
          </button>

          <button class="no-btn" id="noBtn">
            No 😢
          </button>

        </div>

        <div id="crySticker" class="cry hidden"></div>

      </div>


      <!-- STEP 2 -->
      <div class="step hidden" id="step2">

        <h2>Choose a Date 📅</h2>

        <input
          type="text"
          id="dateInput"
          placeholder="Choose Date"
        >

        <input
          type="text"
          id="timeInput"
          placeholder="Choose Time"
        >

        <button class="next-btn" id="dateNext">
          Continue
        </button>

      </div>


      <!-- STEP 3 -->
      <div class="step hidden" id="step3">

        <h2>Choose Your Food 🍽️</h2>

        <div class="food-container">

          <div class="food-card" data-food="Pizza">
            <img src="pizza.jpg" alt="Pizza">
            <h3>Pizza 🍕</h3>
          </div>

          <div class="food-card" data-food="Burger">
            <img src="6.jpg" alt="Burger">
            <h3>Burger 🍔</h3>
          </div>

          <div class="food-card" data-food="Pasta">
            <img src="footer1.jpg" alt="Pasta">
            <h3>Pasta 🍝</h3>
          </div>

          <div class="food-card" data-food="Kabab">
            <img src="5.jpg" alt="Kabab">
            <h3>Kabab 🍢</h3>
          </div>

        </div>

        <button class="next-btn" id="foodNext">
          Continue
        </button>

      </div>


      <!-- STEP 4 -->
      <div class="step hidden" id="step4">

        <h2>Choose Place 📍</h2>

        <div class="place-container">

          <div class="place-card" data-place="Cafe">
            ☕
            <h3>Cafe</h3>
          </div>

          <div class="place-card" data-place="Restaurant">
            🍽️
            <h3>Restaurant</h3>
          </div>

          <div class="place-card" data-place="Park">
            🌳
            <h3>Park</h3>
          </div>

          <div class="place-card" data-place="Beach">
            🏖️
            <h3>Beach</h3>
          </div>

        </div>

        <button class="send-btn" id="sendBtn">
          Send Invitation ❤️
        </button>

      </div>


      <!-- FINAL -->
      <div class="step hidden" id="final">

        <div class="success">

          <div class="emoji">
            🎉❤️🎉
          </div>

          <h1>Thank You!</h1>

          <p>
            Your special plan is ready ✨
          </p>

          <p id="resultText"></p>

        </div>

      </div>

    </section>

  </main>


  <!-- Flatpickr -->
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <script>

    /* DATE */

    flatpickr("#dateInput", {
      dateFormat: "Y-m-d",
      disableMobile: true
    });


    /* TIME */

    flatpickr("#timeInput", {
      enableTime: true,
      noCalendar: true,
      dateFormat: "H:i",
      time_24hr: true,
      disableMobile: true
    });


    /* ELEMENTS */

    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const crySticker = document.getElementById("crySticker");

    const step1 = document.getElementById("step1");
    const step2 = document.getElementById("step2");
    const step3 = document.getElementById("step3");
    const step4 = document.getElementById("step4");
    const final = document.getElementById("final");

    const dateInput = document.getElementById("dateInput");
    const timeInput = document.getElementById("timeInput");

    const dateNext = document.getElementById("dateNext");
    const foodNext = document.getElementById("foodNext");
    const sendBtn = document.getElementById("sendBtn");

    const foodCards = document.querySelectorAll(".food-card");
    const placeCards = document.querySelectorAll(".place-card");

    const resultText = document.getElementById("resultText");

    let selectedFood = "";
    let selectedPlace = "";


    /* STEP */

    function showStep(current, next) {
      current.classList.add("hidden");
      next.classList.remove("hidden");
    }


    /* YES */

    yesBtn.onclick = () => {
      showStep(step1, step2);
    };


    /* NO */

    let touchCount = 0;

    function moveNoButton() {

      const x = Math.random() * 180 - 90;
      const y = Math.random() * 100 - 50;

      noBtn.style.transform =
        `translate(${x}px, ${y}px)`;
    }

    noBtn.onmouseover = moveNoButton;

    noBtn.ontouchstart = (e) => {

      touchCount++;

      if (touchCount < 2) {
        e.preventDefault();
        moveNoButton();
      }
    };

    noBtn.onclick = () => {

      crySticker.innerHTML = `
        <div style="font-size:42px;">😭</div>
        <p>Please don't say no 🥺</p>
      `;

      crySticker.classList.remove("hidden");
    };


    /* DATE */

    dateNext.onclick = () => {

      if (
        dateInput.value === "" ||
        timeInput.value === ""
      ) {

        alert("Please choose date and time 📅⏰");
        return;
      }

      showStep(step2, step3);
    };


    /* FOOD */

    foodCards.forEach((card) => {

      card.onclick = () => {

        foodCards.forEach((item) => {
          item.classList.remove("active");
        });

        card.classList.add("active");

        selectedFood = card.dataset.food;
      };

    });


    foodNext.onclick = () => {

      if (selectedFood === "") {
        alert("Please choose food 🍕");
        return;
      }

      showStep(step3, step4);
    };


    /* PLACE */

    placeCards.forEach((card) => {

      card.onclick = () => {

        placeCards.forEach((item) => {
          item.classList.remove("active");
        });

        card.classList.add("active");

        selectedPlace = card.dataset.place;
      };

    });


    /* FINAL */

    sendBtn.onclick = () => {

      if (selectedPlace === "") {
        alert("Please choose a place 📍");
        return;
      }

      step4.classList.add("hidden");
      final.classList.remove("hidden");

      resultText.innerHTML = `
        📅 <strong>Date:</strong>
        ${dateInput.value}

        <br><br>

        ⏰ <strong>Time:</strong>
        ${timeInput.value}

        <br><br>

        🍴 <strong>Food:</strong>
        ${selectedFood}

        <br><br>

        📍 <strong>Place:</strong>
        ${selectedPlace}

        <br><br>

        ❤️ I can't wait to see you Somiya 👩🏼‍🤝‍👩🏼❤️!

        <br><br>

        <strong>Your friend Samira</strong>
      `;

      createHearts();
    };


    /* FINAL HEARTS */

    function createHearts() {

      for (let i = 0; i < 14; i++) {

        const heart = document.createElement("div");

        heart.innerHTML =
          Math.random() > .5 ? "❤️" : "♡";

        heart.style.position = "fixed";
        heart.style.left =
          Math.random() * 100 + "vw";
        heart.style.top = "100vh";
        heart.style.fontSize =
          18 + Math.random() * 25 + "px";
        heart.style.zIndex = "9999";
        heart.style.pointerEvents = "none";

        heart.style.animation =
          `heartRise ${2.5 + Math.random() * 2}s linear forwards`;

        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 5000);
      }
    }


    /* HEART ANIMATION */

    const heartStyle =
      document.createElement("style");

    heartStyle.innerHTML = `
      @keyframes heartRise {

        0% {
          transform:
            translateY(0)
            rotate(0)
            scale(.7);
          opacity: 0;
        }

        15% {
          opacity: 1;
        }

        100% {
          transform:
            translateY(-115vh)
            rotate(25deg)
            scale(1.2);
          opacity: 0;
        }

      }
    `;

    document.head.appendChild(heartStyle);

  </script>

</body>
</html>
